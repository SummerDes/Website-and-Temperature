<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DHT11 Environmental Dashboard</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
    background-color: #f4f4f9;
}
button {
    font-size: 20px;
    padding: 12px 24px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
}
button:hover {
    background-color: #0056b3;
}
.card-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 30px;
}
.card {
    background: white;
    padding: 20px 40px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}
.value {
    font-size: 48px;
    font-weight: bold;
    color: #28a745;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Live DHT11 Sensor Monitor</h1>
<p>Connected via Web Serial API</p>

<button id="connect">Connect Arduino</button>

<div class="card-container">
    <div class="card">
        <h3>Humidity</h3>
        <div id="humidity" class="value">--%</div>
    </div>
    <div class="card">
        <h3>Temperature</h3>
        <div id="temperature" class="value">--°C</div>
    </div>
</div>

<script>
let port;
let reader;
let keepReading = true;

async function connectSerial() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        
        document.getElementById("connect").innerText = "Connected";
        document.getElementById("connect").style.backgroundColor = "#28a745";
        
        readData();
    } catch (err) {
        console.error("Connection failed:", err);
    }
}

async function readData() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();

    try {
        let buffer = "";
        while (keepReading) {
            const { value, done } = await reader.read();
            if (done) break;
            
            buffer += value;
            let lines = buffer.split("\n");
            buffer = lines.pop(); 
            
            for (let line of lines) {
                let trimmed = line.trim();
                if (trimmed.includes(",")) {
                    let parts = trimmed.split(",");
                    let humidity = parts[0];
                    let temperature = parts[1];
                  
                    document.getElementById("humidity").innerText = humidity + "%";
                    document.getElementById("temperature").innerText = temperature + "°C";
                }
            }
        }
    } catch (error) {
        console.error("Read error:", error);
    } finally {
        reader.releaseLock();
    }
}

document.getElementById("connect").onclick = connectSerial;
</script>

</body>
</html>
